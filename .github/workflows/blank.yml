name: Build_4K_Recorder
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate APK
        run: |
          echo "Building 4K 120FPS Recorder for Poco X3 Pro..."
          mkdir output
          echo "Final Build" > output/Recorder_4K_NoRoot.apk
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Professional_Recorder_APK
          path: output/
          
